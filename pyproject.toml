[project]
name = "small-image-generator"
version = "0.1.0"
description = "Minimal prompt -> image pipeline for finding the smallest cartoon text-to-image model"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "peft",
    "datasets>=5.2.0",
    "pillow>=12.3.0",
    "torchvision>=0.29.2",
]
